<p-toast></p-toast>

<div class="surface-0">
    <div class="flex align-items-center justify-content-between flex-column h-screen">
        <div class="flex flex-column align-items-center justify-content-center w-full md:w-4 h-full text-center py-6 px-4">
            <a [routerLink]="['/']" class="mb-6">
                <img src="assets/layout/images/logo-ac.png" alt="AC Ingenieria" height="96" />
            </a>
            <div class="flex flex-column">
                <span class="p-input-icon-left w-full mb-4">
                    <i class="pi pi-envelope"></i>
                    <input id="email" type="text" pInputText [(ngModel)]="email" class="w-full md:w-25rem text-color-secondary surface-50 border-200" placeholder="Email" />
                </span>
                <span class="p-input-icon-left w-full mb-4">
                    <i class="pi pi-lock"></i>
                    <input id="password" type="password" pInputText [(ngModel)]="password" class="w-full md:w-25rem text-color-secondary surface-50 border-200" placeholder="Password" />
                </span>

                <button pButton pRipple label="Log In" class="w-full mb-4" (click)="onLogin()"></button>
                <a href="#" class="font-medium text-sm text-300">forget password?</a>
                <p class="font-medium text-400 m-0 mt-6">Donâ€™t you have an account, <a href="#" class="text-primary cursor-pointer">sign up</a></p>
            </div>
        </div>
        <div class="flex flex-wrap align-items-center pb-8 px-4">
            <img src="assets/layout/images/logo-ac.png" alt="AC Ingenieria" style="height: 28px; width: auto; margin-right: 1.25rem" />
            <h6 class="m-0 font-medium text-300">© AC Ingenieria</h6>
        </div>
    </div>
</div>

<app-config [minimal]="true"></app-config>
